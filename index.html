<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F7">

<title>Brecha Territorial · Observatorio Cívico de Chile</title>
<meta name="description" content="Mapa de las 345 comunas de Chile coloreado por brecha: cuánto se aparta cada comuna del resultado que su propio contexto predice. 70 indicadores de fuentes oficiales.">

<meta property="og:title" content="Brecha Territorial · Observatorio Cívico de Chile">
<meta property="og:description" content="No un ranking. Cuánto rinde cada comuna respecto a lo que su contexto predice, sobre 70 indicadores oficiales.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://majajicl.github.io/chile-observatorio-medios/">

<!-- Restringe de dónde puede cargar el navegador. 'self' cubre datos y scripts
     propios; el único origen externo son las tipografías de Google. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./manifest.json">
</head>
<body>

<div class="loading" id="loading">
  <b>Observatorio Cívico de Chile</b>
  <span>Cargando 345 comunas y 70 indicadores oficiales…</span>
</div>

<header class="topbar">
  <div class="brand">
    <b>Brecha Territorial</b>
    <span>Observatorio Cívico de Chile</span>
  </div>

  <div class="ticker" id="ticker" aria-label="Indicadores economicos"></div>

  <div class="search-wrap">
    <label class="sr-only" for="q">Buscar comuna</label>
    <input class="search" id="q" type="search" placeholder="Buscar comuna…"
           autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
    <div class="results" id="results" role="listbox" aria-label="Resultados"></div>
  </div>
</header>

<main class="shell">
  <div class="mapcol">
    <nav class="layers" id="layers" aria-label="Capas del mapa"></nav>

    <div class="question" id="question">
      <h1 id="q-title">—</h1>
      <p id="q-sub">—</p>
    </div>

    <div class="mzbar" id="mzbar" hidden>
      <div>
        <div class="tit" id="mz-tit">—</div>
        <div class="sub" id="mz-sub">—</div>
      </div>
      <label class="sr-only" for="mz-capa">Indicador por manzana</label>
      <select id="mz-capa"></select>
      <button class="volver" id="mz-volver">← Volver al mapa nacional</button>
    </div>

    <div class="mzstage" id="mzstage"><div class="mzwrap" id="mzwrap"></div></div>

    <div class="mapstage" id="stage">
      <div class="tramos" id="tramos"></div>
      <div class="insets" id="insets"></div>
    </div>

    <div class="legend">
      <span class="scale-lbl" id="lg-lo">Bajo lo esperado</span>
      <div class="scale" id="scale"></div>
      <span class="scale-lbl" id="lg-hi">Sobre lo esperado</span>
      <div class="src" id="src">—</div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<div class="tip" id="tip" role="status"></div>

<script src="./app.js"></script>
</body>
</html>
