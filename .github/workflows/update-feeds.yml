name: Cron Live Feeds Update

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion and Clustering Pipeline
        run: |
          python cli.py pipeline --limit 10
          python export_snapshot.py

      - name: Commit updated snapshot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json observatorio.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update Chilean media snapshot [skip ci]" && git push)
